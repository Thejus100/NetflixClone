<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Netflix Clone</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg" alt="Netflix Logo">
    <button class="signin-btn">Sign In</button>
  </header>

  <section class="hero">
    <div class="hero-content">
      <h1>Unlimited movies, TV shows, and more.</h1>
      <h2>Watch anywhere. Cancel anytime.</h2>
      <p>Ready to watch? Enter your email to create or restart your membership.</p>
      <div class="email-form">
        <input type="email" placeholder="Email address">
        <button>Get Started</button>
      </div>
    </div>
  </section>

  <section class="movie-row">
    <h2>Trending Now</h2>
    <div class="row-posters">
      <img src="https://via.placeholder.com/150x220" class="poster" alt="Movie 1">
      <img src="https://via.placeholder.com/150x220" class="poster" alt="Movie 2">
      <img src="https://via.placeholder.com/150x220" class="poster" alt="Movie 3">
      <img src="https://via.placeholder.com/150x220" class="poster" alt="Movie 4">
      <img src="https://via.placeholder.com/150x220" class="poster" alt="Movie 5">
      <img src="https://via.placeholder.com/150x220" class="poster" alt="Movie 6">
    </div>
  </section>

  <footer>
    <p>Netflix Clone by @YourName | For Educational Use Only</p>
  </footer>
</body>
</html>
